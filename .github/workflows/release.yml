name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        with:
          go-version-file: threadmap/go.mod
          cache: false
      - run: npm ci && npm run build
        working-directory: threadmap/web
      - run: go test ./...
        working-directory: threadmap

      - run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: threadmap
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mcreekmore/threadmap:${{ env.version }}
          labels: |
            io.hass.type=addon
            io.hass.version=${{ env.version }}
          provenance: false

      # HA offers an update as soon as `version` changes, so this must come after the image exists.
      - name: Set the add-on version on main
        run: |
          git fetch origin main
          git checkout main
          sed -i "s/^version: .*/version: \"$version\"/" threadmap/config.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || { git commit -am "Release $version" && git push origin main; }

      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
