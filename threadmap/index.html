<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread map</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7f8; --panel: #fff; --text: #1c2024; --muted: #5d6670; --line: #d9dde1; --accent: #03a9f4;
  --q3: #1e8e4e; --q2: #7a9a01; --q1: #d9730d; --q0: #c62828; --unknown: #7c8791;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --panel: #1b1f24; --text: #e7eaed; --muted: #a0a9b2; --line: #333a42; --accent: #4fc3f7;
    --q3: #4cc47f; --q2: #b5d334; --q1: #f0a04b; --q0: #ef6a6a; --unknown: #8a95a0;
  }
}
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
main { max-width: 1100px; margin: auto; display: grid; gap: 12px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
h1 { font-size: 20px; margin: 0; }
#status { color: var(--muted); flex: 1; min-width: 160px; }
button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; cursor: pointer; }
button:disabled { opacity: .6; cursor: progress; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; overflow-x: auto; }
#map { padding: 0; }
svg { display: block; width: 100%; height: min(62vh, 560px); touch-action: none; }
.edge { stroke-width: 3; }
.edge.unknown { stroke-dasharray: 6 5; }
.edge-label { font-size: 12px; fill: var(--muted); paint-order: stroke; stroke: var(--panel); stroke-width: 4; text-anchor: middle; }
.node { cursor: grab; }
.node circle { fill: var(--panel); stroke: var(--muted); stroke-width: 2.5; }
.node.border circle { fill: var(--accent); stroke: var(--accent); }
.node text { fill: var(--text); font-size: 13px; text-anchor: middle; paint-order: stroke; stroke: var(--panel); stroke-width: 4; }
.node .role { fill: var(--muted); font-size: 11px; }
#legend { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 13px; }
#legend i { display: inline-block; width: 22px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 6px; }
#warnings:empty, #error:empty { display: none; }
#warnings, #error { margin: 0; }
#warnings { padding-left: 32px; }
#error { color: var(--q0); }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; }
td code { font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Thread map</h1>
    <span id="status" role="status"></span>
    <button id="refresh" type="button">Refresh</button>
  </header>
  <p id="error" class="panel" role="alert"></p>
  <div id="map" class="panel">
    <svg id="graph" viewBox="0 0 800 500" role="img" aria-label="Diagram of Thread devices and their links; the same information is in the table below"></svg>
  </div>
  <div id="legend">
    <span><i style="border-color:var(--q3)"></i>Quality 3</span>
    <span><i style="border-color:var(--q2)"></i>Quality 2</span>
    <span><i style="border-color:var(--q1)"></i>Quality 1</span>
    <span><i style="border-color:var(--q0)"></i>Quality 0</span>
    <span><i style="border-color:var(--unknown);border-top-style:dashed"></i>Child link</span>
  </div>
  <ul id="warnings" class="panel"></ul>
  <div class="panel">
    <table>
      <thead><tr><th>Device</th><th>Role</th><th>RLOC16</th><th>MAC</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script>
const W = 800, H = 500, NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
let positions = {};

// Device names come from the network, so all text goes through textContent, never innerHTML.
function el(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}

function role(n) {
  if (n.kind === "child") return "Child";
  return [n.border && "Border router", n.leader && "Leader", !n.border && "Router"].filter(Boolean).join(", ");
}

// Plain force layout: nodes repel, links pull, gravity keeps everything centred.
function layout(nodes, links) {
  const p = {};
  nodes.forEach((n, i) => {
    const a = 2 * Math.PI * i / nodes.length;
    p[n.rloc] = positions[n.rloc] || { x: W / 2 + 170 * Math.cos(a), y: H / 2 + 150 * Math.sin(a) };
  });
  for (let t = 0; t < 300; t++) {
    const f = {};
    nodes.forEach(n => f[n.rloc] = { x: (W / 2 - p[n.rloc].x) * .01, y: (H / 2 - p[n.rloc].y) * .01 });
    nodes.forEach(a => nodes.forEach(b => {
      if (a === b) return;
      const dx = p[a.rloc].x - p[b.rloc].x, dy = p[a.rloc].y - p[b.rloc].y, d2 = Math.max(dx * dx + dy * dy, 1);
      f[a.rloc].x += 9000 * dx / d2 / Math.sqrt(d2) * 3;
      f[a.rloc].y += 9000 * dy / d2 / Math.sqrt(d2) * 3;
    }));
    links.forEach(l => {
      const dx = p[l.b].x - p[l.a].x, dy = p[l.b].y - p[l.a].y, d = Math.max(Math.hypot(dx, dy), 1);
      const pull = (d - 230) * .03;
      f[l.a].x += pull * dx / d; f[l.a].y += pull * dy / d;
      f[l.b].x -= pull * dx / d; f[l.b].y -= pull * dy / d;
    });
    nodes.forEach(n => {
      p[n.rloc].x = Math.min(W - 90, Math.max(90, p[n.rloc].x + f[n.rloc].x));
      p[n.rloc].y = Math.min(H - 60, Math.max(40, p[n.rloc].y + f[n.rloc].y));
    });
  }
  return p;
}

function draw(data) {
  const svg = $("graph");
  svg.replaceChildren();
  const known = new Set(data.nodes.map(n => n.rloc));
  const links = data.links.filter(l => known.has(l.a) && known.has(l.b));
  positions = layout(data.nodes, links);

  const edges = links.map(l => {
    const line = el("line", {
      class: "edge" + (l.quality === null ? " unknown" : ""),
      stroke: l.quality === null ? "var(--unknown)" : `var(--q${Math.min(Math.max(l.quality, 0), 3)})`,
    });
    const label = el("text", { class: "edge-label" }, l.quality === null ? "" : "q" + l.quality);
    svg.append(line, label);
    return { l, line, label };
  });

  const groups = data.nodes.map(n => {
    const g = el("g", { class: "node" + (n.border ? " border" : "") });
    g.append(
      el("circle", { r: n.kind === "child" ? 11 : n.border ? 20 : 16 }),
      el("text", { y: n.border ? 38 : 34 }, n.label),
      el("text", { class: "role", y: n.border ? 53 : 49 }, role(n)),
    );
    svg.append(g);
    drag(g, n);
    return { n, g };
  });

  function place() {
    edges.forEach(({ l, line, label }) => {
      const a = positions[l.a], b = positions[l.b];
      line.setAttribute("x1", a.x); line.setAttribute("y1", a.y);
      line.setAttribute("x2", b.x); line.setAttribute("y2", b.y);
      label.setAttribute("x", (a.x + b.x) / 2); label.setAttribute("y", (a.y + b.y) / 2 - 8);
    });
    groups.forEach(({ n, g }) => g.setAttribute("transform", `translate(${positions[n.rloc].x} ${positions[n.rloc].y})`));
  }

  function drag(g, n) {
    g.addEventListener("pointerdown", e => {
      g.setPointerCapture(e.pointerId);
      const move = ev => {
        const pt = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(svg.getScreenCTM().inverse());
        positions[n.rloc] = { x: Math.min(W, Math.max(0, pt.x)), y: Math.min(H, Math.max(0, pt.y)) };
        place();
      };
      const up = () => { g.removeEventListener("pointermove", move); g.removeEventListener("pointerup", up); };
      g.addEventListener("pointermove", move);
      g.addEventListener("pointerup", up);
    });
  }
  place();

  $("rows").replaceChildren(...data.nodes.map(n => {
    const tr = document.createElement("tr");
    [n.label, role(n), n.rloc, n.mac || "unknown"].forEach((v, i) => {
      const td = document.createElement("td");
      if (i >= 2) { const c = document.createElement("code"); c.textContent = v; td.append(c); }
      else td.textContent = v;
      tr.append(td);
    });
    return tr;
  }));
  $("warnings").replaceChildren(...data.warnings.map(w => {
    const li = document.createElement("li");
    li.textContent = w;
    return li;
  }));
}

async function refresh() {
  $("refresh").disabled = true;
  $("status").textContent = "Scanning the mesh…";
  $("error").textContent = "";
  try {
    // Relative URL: under ingress the page lives below a per-session path.
    const r = await fetch("api/topology", { cache: "no-store" });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    draw(data);
    const n = data.nodes.length;
    $("status").textContent = `${n} device${n === 1 ? "" : "s"}, scanned ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    $("error").textContent = e.message;
    $("status").textContent = "Scan failed";
  } finally {
    $("refresh").disabled = false;
  }
}

$("refresh").addEventListener("click", refresh);
refresh();
</script>
</body>
</html>
